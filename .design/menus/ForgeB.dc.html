<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; }
    a { color: #E07A3B; } a:hover { color: #B24C18; }
    .lbl { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cut { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
    .cutin { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
    .cs { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  </style>
</helmet>

<div style="width: 680px; height: 464px; background: radial-gradient(120% 100% at 50% 30%, #241F1B 0%, #14110F 74%); display: flex; align-items: center; justify-content: center;">

  <div class="cut" style="width: 640px; height: 424px; background: linear-gradient(#4C443C, #14110F); padding: 2px;">
    <div class="cutin" style="width: 100%; height: 100%; background: #16120F; display: flex; flex-direction: column;">

      <div style="height: 4px; background: #E07A3B;"></div>

      <div style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 13px; background: #1C1815; border-bottom: 1px solid #3C352F;">
        <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="#E07A3B" stroke-width="1.7" stroke-linejoin="round"><path d="M4 15c0-4 3-5 3-9 2 2 2 3 2 4 1-1 2-3 1-6 3 2 5 6 5 11"></path><path d="M4 15h11l2 4H4z"></path></svg>
        <span class="lbl" style="color: #EDE7DC; font-size: 14px; flex-grow: 1;">Forge</span>
        <span class="lbl" style="color: #A79C8C; font-size: 10px;">Tempered</span>
        <span class="num" style="color: #5FA082; font-size: 12px;">+35</span>
        <svg width="15" height="15" viewBox="0 0 16 16" stroke="#A79C8C" stroke-width="1.8" fill="none"><path d="M3 3l10 10M13 3L3 13"></path></svg>
      </div>

      <div style="display: flex; gap: 6px; padding: 7px 11px 0;">
        <div class="cs" style="background: #E07A3B; padding: 8px 18px;"><span class="lbl" style="color: #16120F; font-size: 10px;">Weapons</span></div>
        <div class="cs" style="background: #221D1A; padding: 8px 18px;"><span class="lbl" style="color: #A79C8C; font-size: 10px;">Smelting</span></div>
      </div>

      <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1fr) 214px; gap: 10px; padding: 9px 11px 11px;">

        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span class="lbl" style="color: #A79C8C; font-size: 10px;">Roll table</span>
            <span class="num" style="color: #A79C8C; font-size: 10px;">snipers &middot; t3+</span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="lbl" style="color: #6E6A64; font-size: 10px; width: 62px;">Common</span>
            <div style="flex-grow: 1; height: 13px; background: #1C1815;"><div style="width: 42%; height: 100%; background: #6E6A64;"></div></div>
            <span class="num" style="color: #A79C8C; font-size: 11px; width: 30px; text-align: right;">42%</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="lbl" style="color: #6EBE6E; font-size: 10px; width: 62px;">Uncommon</span>
            <div style="flex-grow: 1; height: 13px; background: #1C1815;"><div style="width: 30%; height: 100%; background: #6EBE6E;"></div></div>
            <span class="num" style="color: #A79C8C; font-size: 11px; width: 30px; text-align: right;">30%</span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px dashed #E07A3B; border-bottom: 1px dashed #E07A3B;">
            <span class="lbl" style="color: #5A96DC; font-size: 10px; width: 62px;">Rare</span>
            <div style="flex-grow: 1; height: 13px; background: #1C1815;"><div style="width: 18%; height: 100%; background: #5A96DC;"></div></div>
            <span class="num" style="color: #A79C8C; font-size: 11px; width: 30px; text-align: right;">18%</span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="lbl" style="color: #AA64DC; font-size: 10px; width: 62px;">Epic</span>
            <div style="flex-grow: 1; height: 13px; background: #1C1815;"><div style="width: 7%; height: 100%; background: #AA64DC;"></div></div>
            <span class="num" style="color: #A79C8C; font-size: 11px; width: 30px; text-align: right;">7%</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="lbl" style="color: #E6AF3C; font-size: 10px; width: 62px;">Legendary</span>
            <div style="flex-grow: 1; height: 13px; background: #1C1815;"><div style="width: 3%; height: 100%; background: #E6AF3C;"></div></div>
            <span class="num" style="color: #A79C8C; font-size: 11px; width: 30px; text-align: right;">3%</span>
          </div>

          <span style="color: #E07A3B; font-size: 10px;">Pity floor sits here &mdash; 4 rolls away.</span>

          <div style="height: 1px; background: #2A2521; margin: 3px 0;"></div>

          <span class="lbl" style="color: #A79C8C; font-size: 10px;">Last five</span>
          <div style="display: flex; gap: 5px;">
            <div class="cs" style="width: 34px; height: 34px; background: #1C1815; border: 1px solid #5A96DC; display: flex; align-items: center; justify-content: center;"><span class="lbl" style="color: #5A96DC; font-size: 12px;">R</span></div>
            <div class="cs" style="width: 34px; height: 34px; background: #1C1815; border: 1px solid #3C352F; display: flex; align-items: center; justify-content: center;"><span class="lbl" style="color: #6E6A64; font-size: 12px;">C</span></div>
            <div class="cs" style="width: 34px; height: 34px; background: #1C1815; border: 1px solid #3C352F; display: flex; align-items: center; justify-content: center;"><span class="lbl" style="color: #6EBE6E; font-size: 12px;">U</span></div>
            <div class="cs" style="width: 34px; height: 34px; background: #1C1815; border: 1px solid #3C352F; display: flex; align-items: center; justify-content: center;"><span class="lbl" style="color: #6E6A64; font-size: 12px;">C</span></div>
            <div class="cs" style="width: 34px; height: 34px; background: #1C1815; border: 1px solid #3C352F; display: flex; align-items: center; justify-content: center;"><span class="lbl" style="color: #6E6A64; font-size: 12px;">C</span></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div class="cs" style="background: #28231F; border: 1px solid #4C443C; padding: 9px 10px; display: flex; align-items: center; gap: 8px;">
            <svg width="17" height="17" viewBox="0 0 22 22" fill="none" stroke="#E07A3B" stroke-width="1.6"><path d="M3 13h12l4-3-4-3H3z"></path><path d="M6 13v4"></path></svg>
            <span class="lbl" style="color: #EDE7DC; font-size: 10px; flex-grow: 1;">Snipers</span>
            <svg width="11" height="11" viewBox="0 0 12 12" stroke="#A79C8C" stroke-width="1.8" fill="none"><path d="M2 4l4 4 4-4"></path></svg>
          </div>

          <div class="cs" style="background: #1C1815; border: 1px solid #3C352F; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; align-items: baseline; gap: 6px;">
              <span style="color: #A79C8C; font-size: 12px; flex-grow: 1;">Scrap</span>
              <span class="num" style="color: #EDE7DC; font-size: 12px;">250</span>
            </div>
            <div style="display: flex; align-items: baseline; gap: 6px;">
              <span style="color: #A79C8C; font-size: 12px; flex-grow: 1;">Steel Ingot</span>
              <span class="num" style="color: #EDE7DC; font-size: 12px;">4</span>
            </div>
            <div style="display: flex; align-items: baseline; gap: 6px;">
              <span style="color: #BE5A4B; font-size: 12px; flex-grow: 1;">Copper Coil</span>
              <span class="num" style="color: #BE5A4B; font-size: 12px;">1 / 2</span>
            </div>
          </div>

          <div class="cs" style="background: #1A1614; border: 1px solid #5FA082; padding: 8px 10px; display: flex; align-items: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 22 22" fill="none" stroke="#5FA082" stroke-width="1.6"><path d="M9 3h4v5l4 8a2 2 0 01-2 3H7a2 2 0 01-2-3l4-8z"></path></svg>
            <span style="color: #EDE7DC; font-size: 11px; flex-grow: 1;">Use potion</span>
            <div style="width: 26px; height: 14px; background: #5FA082; display: flex; align-items: center; justify-content: flex-end; padding: 2px;"><div style="width: 10px; height: 10px; background: #16120F;"></div></div>
          </div>

          <div style="flex-grow: 1;"></div>

          <div class="cs" style="background: linear-gradient(#E07A3B, #B24C18); padding: 18px; text-align: center; box-shadow: 0 3px 0 #7A3410;">
            <span class="lbl" style="color: #16120F; font-size: 17px;">Pull</span>
          </div>
          <span class="num" style="color: #A79C8C; font-size: 10px; text-align: center;">11 / 15 to pity</span>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@600&display=swap">
  <style>
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; }
    a { color: #E07A3B; } a:hover { color: #B24C18; }
    .lbl { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; }
    .cut { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  </style>
</helmet>

<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, #2A241F 0%, #14110F 72%);">

  <div style="position: absolute; left: 50%; top: 54%; width: 940px; height: 300px; transform: translateX(-50%); background: #241F1B; clip-path: polygon(21% 0%, 79% 0%, 100% 100%, 0% 100%); border-top: 1px solid #3C352F;"></div>

  <div style="position: absolute; left: 0; top: 0; width: 300px; height: 96px; border-left: 3px solid #E07A3B; border-top: 3px solid #E07A3B; opacity: 0.55;"></div>

  <div class="cut" style="position: absolute; left: 18px; top: 18px; display: flex; gap: 22px; background: rgba(20, 17, 15, 0.88); padding: 14px 22px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#E07A3B" stroke-width="1.8"><path d="M4 7l5-3 7 3-2 8-8 1z"/></svg>
      <span class="num" style="color: #EDE7DC; font-size: 18px;">12,480</span>
    </div>
    <div style="width: 1px; background: #3C352F;"></div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5FA082" stroke-width="1.8"><path d="M10 3l6 3.5v7L10 17l-6-3.5v-7z"/></svg>
      <span class="num" style="color: #EDE7DC; font-size: 18px;">318</span>
    </div>
    <div style="width: 1px; background: #3C352F;"></div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5FA082" stroke-width="1.8"><path d="M11 2L5 11h4l-1 7 7-9h-4z"/></svg>
      <span class="num" style="color: #EDE7DC; font-size: 18px;">7<span style="color: #A79C8C;">/10</span></span>
    </div>
  </div>

  <div class="cut" style="position: absolute; left: 50%; top: 60px; transform: translateX(-50%); background: rgba(190, 90, 75, 0.16); border-left: 3px solid #BE5A4B; padding: 12px 22px;">
    <span style="color: #EDE7DC; font-size: 15px;">Tool tier too low for Titanium.</span>
  </div>

  <div class="cut" style="position: absolute; right: 0; top: 50%; width: 420px; transform: translateY(-50%); background: rgba(20, 17, 15, 0.94); border-left: 3px solid #E07A3B;">
    <div style="display: flex; align-items: center; padding: 20px 24px 0;">
      <span class="lbl" style="color: #EDE7DC; font-size: 13px; flex-grow: 1;">Inventory</span>
      <svg width="13" height="13" viewBox="0 0 12 12" stroke="#A79C8C" stroke-width="1.8"><path d="M2 2l8 8M10 2l-8 8"/></svg>
    </div>
    <div style="display: flex; gap: 8px; padding: 16px 24px 0;">
      <div class="lbl" style="font-size: 9px; color: #14110F; background: #E07A3B; padding: 7px 12px;">Weapons</div>
      <div class="lbl" style="font-size: 9px; color: #A79C8C; background: #262120; padding: 7px 12px;">Tools</div>
      <div class="lbl" style="font-size: 9px; color: #A79C8C; background: #262120; padding: 7px 12px;">Mods</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 18px 24px 24px;">
      <div class="cut" style="height: 76px; background: #282320; box-shadow: inset 0 0 0 2px #E07A3B; display: flex; align-items: flex-end; padding: 8px;"><span class="num" style="color: #E07A3B; font-size: 11px;">II</span></div>
      <div class="cut" style="height: 76px; background: #282320;"></div>
      <div class="cut" style="height: 76px; background: #282320;"></div>
      <div class="cut" style="height: 76px; background: #282320;"></div>
      <div class="cut" style="height: 76px; background: #1A1614;"></div>
      <div class="cut" style="height: 76px; background: #1A1614;"></div>
      <div class="cut" style="height: 76px; background: #1A1614;"></div>
      <div class="cut" style="height: 76px; background: #1A1614;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; width: 260px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span class="lbl" style="color: #A79C8C; font-size: 9px; flex-grow: 1;">Integrity</span>
      <span class="num" style="color: #EDE7DC; font-size: 13px;">86</span>
    </div>
    <div style="display: flex; gap: 3px; height: 10px;">
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #5FA082;"></div>
      <div style="flex-grow: 1; background: #2C2724;"></div>
      <div style="flex-grow: 1; background: #2C2724;"></div>
    </div>
    <div class="cut" style="display: flex; align-items: center; gap: 10px; background: rgba(20, 17, 15, 0.88); padding: 10px 14px;">
      <span class="lbl" style="color: #EDE7DC; font-size: 10px; flex-grow: 1;">Research T3</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#E07A3B" stroke-width="2"><path d="M4 2l4 4-4 4"/></svg>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 12px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div class="cut" style="width: 56px; height: 56px; display: grid; place-items: center; background: rgba(40, 35, 32, 0.9);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EDE7DC" stroke-width="1.7"><path d="M4 7h16v13H4z"/><path d="M4 7l2-3h12l2 3M12 7v13"/></svg>
      </div>
      <span class="lbl" style="color: #A79C8C; font-size: 8px;">Inventory</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div class="cut" style="width: 108px; height: 72px; display: grid; place-items: center; background: #E07A3B; box-shadow: 0 0 26px rgba(224, 122, 59, 0.45);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#241407" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 6.6-7 9-4-2.4-7-5-7-9V6z"/></svg>
      </div>
      <span class="lbl" style="color: #E07A3B; font-size: 9px;">Start Defense</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div class="cut" style="width: 56px; height: 56px; display: grid; place-items: center; background: rgba(40, 35, 32, 0.9);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EDE7DC" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg>
      </div>
      <span class="lbl" style="color: #A79C8C; font-size: 8px;">Recall</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

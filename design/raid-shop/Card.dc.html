<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@500;700&amp;family=Montserrat:wght@500;700;800&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 240px; height: 392px; box-sizing: border-box; display: flex; flex-direction: column; background: #201B17; border: 1px solid {{c.border}}; border-radius: 10px; overflow: hidden; font-family: 'Source Sans 3', sans-serif; color: #EDE7DC;">
<div style="height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: {{c.tint}}; border-bottom: 1px solid {{c.border}};">
<span style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.14em; color: {{c.color}};">{{c.rarityLabel}}</span>
<span style="font-family: Inconsolata, monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.12em; color: #A79C8C;">{{c.kind}}</span>
</div>
<div style="position: relative; margin: 12px 12px 0; height: 116px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #16120F; border: 1px solid #3C352F; border-radius: 8px;">
<div style="width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; border-radius: 38px; background: {{c.tint}}; border: 1px solid {{c.border}};">
<sc-if value="{{c.isDamage}}" hint-placeholder-val="{{ true }}">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.2"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
</sc-if>
<sc-if value="{{c.isHp}}" hint-placeholder-val="{{ false }}">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M12 9v6M9 12h6"></path></svg>
</sc-if>
<sc-if value="{{c.isOrbit}}" hint-placeholder-val="{{ false }}">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"></circle><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"></circle><path d="M18 4.5l2.5 1-1 2.5zM6 19.5l-2.5-1 1-2.5z"></path></svg>
</sc-if>
<sc-if value="{{c.isBeacon}}" hint-placeholder-val="{{ false }}">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10v11M8 21h8M9.5 21L12 13l2.5 8"></path><circle cx="12" cy="8" r="1.8"></circle><path d="M8.2 4.6a5 5 0 0 0 0 6.8M15.8 4.6a5 5 0 0 1 0 6.8M5.5 2.5a8.5 8.5 0 0 0 0 11M18.5 2.5a8.5 8.5 0 0 1 0 11"></path></svg>
</sc-if>
</div>
<sc-if value="{{c.rarityUp}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 8px; right: 8px; padding: 3px 7px; border-radius: 4px; background: {{c.color}}; color: #16120F; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.1em;">RARITY UP</div>
</sc-if>
<sc-if value="{{c.isNew}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 8px; right: 8px; padding: 3px 7px; border-radius: 4px; background: #E07A3B; color: #16120F; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.1em;">NEW</div>
</sc-if>
</div>
<div style="padding: 12px 14px 0; display: flex; flex-direction: column; gap: 4px;">
<div style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.15;">{{c.name}}</div>
<div style="font-size: 15px; line-height: 1.3; color: #A79C8C;">{{c.effectLabel}} <span style="color: #EDE7DC; font-weight: 600;">{{c.effectFrom}}</span><sc-if value="{{c.hasArrow}}" hint-placeholder-val="{{ true }}"><span style="color: #A79C8C;"> → </span><span style="color: #7BC0A0; font-weight: 700;">{{c.effectTo}}</span></sc-if></div>
</div>
<div style="padding: 12px 14px 0; display: flex; flex-direction: column; gap: 7px;">
<sc-if value="{{c.oneUse}}" hint-placeholder-val="{{ false }}">
<div style="font-family: Inconsolata, monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: {{c.color}};">ONE USE</div>
<div style="font-size: 13px; line-height: 1.3; color: #A79C8C;">Counts as a clean extract. Your ore comes home.</div>
</sc-if>
<sc-if value="{{c.hasLevels}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-family: Inconsolata, monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: #EDE7DC;">{{c.levelText}}</span>
<span style="font-family: Inconsolata, monospace; font-weight: 500; font-size: 12px; color: #A79C8C;">{{c.capText}}</span>
</div>
<div style="display: flex; gap: 6px;">
<sc-for list="{{c.pips}}" as="pip" hint-placeholder-count="5">
<div style="{{pip.style}}"></div>
</sc-for>
</div>
</sc-if>
</div>
<div style="margin-top: auto; padding: 12px;">
<sc-if value="{{c.affordable}}" hint-placeholder-val="{{ true }}">
<button type="button" style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 6px; background: #E07A3B; color: #16120F; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.06em; cursor: pointer;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16120F" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"></path><circle cx="12" cy="12" r="3.2"></circle></svg>
<span>{{c.price}}</span>
</button>
</sc-if>
<sc-if value="{{c.broke}}" hint-placeholder-val="{{ false }}">
<button type="button" disabled style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #3C352F; border-radius: 6px; background: #16120F; color: #D9776A; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.06em;">
<sc-if value="{{c.showNut}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D9776A" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"></path><circle cx="12" cy="12" r="3.2"></circle></svg></sc-if>
<span>{{c.price}}</span>
</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"card":{"editor":null},"$preview":{"width":240,"height":392}}'>
class Component extends DCLogic {
  renderVals() {
    var RARITY = {
      Rare: { color: '#5A96DC', tint: 'rgba(90,150,220,0.14)', border: 'rgba(90,150,220,0.55)', cap: 3 },
      Epic: { color: '#AA64DC', tint: 'rgba(170,100,220,0.14)', border: 'rgba(170,100,220,0.55)', cap: 4 },
      Legendary: { color: '#E6AF3C', tint: 'rgba(230,175,60,0.14)', border: 'rgba(230,175,60,0.7)', cap: 5 }
    };
    var d = this.props.card || {
      name: 'Overclock Chip', kind: 'PERK', rarity: 'Epic', icon: 'damage',
      effectLabel: 'Damage', effectFrom: '+16%', effectTo: '+24%',
      fromLv: 2, toLv: 3, price: 140, affordable: true
    };
    var r = RARITY[d.rarity] || RARITY.Rare;
    var prevCap = d.prevCap || r.cap;
    var base = 'flex: 1; height: 8px; border-radius: 2px; box-sizing: border-box; ';
    var pips = [1, 2, 3, 4, 5].map(function (i) {
      var s;
      if (i <= d.fromLv) s = 'background: ' + r.color + '; border: 1px solid ' + r.color + ';';
      else if (i <= d.toLv) s = 'background: ' + r.color + '; border: 1px solid #EDE7DC; box-shadow: 0 0 0 2px ' + r.tint + ';';
      else if (i <= r.cap && i > prevCap) s = 'background: ' + r.tint + '; border: 1px solid ' + r.color + ';';
      else if (i <= r.cap) s = 'background: transparent; border: 1px solid ' + r.border + ';';
      else s = 'background: #16120F; border: 1px dashed #3C352F;';
      return { style: base + s };
    });
    var levelText = d.oneUse ? '' : (d.rarityUp ? 'LV ' + d.toLv + ' KEPT'
      : (d.fromLv === 0 ? 'LV 1' : 'LV ' + d.fromLv + ' → ' + d.toLv));
    var capText = d.rarityUp ? 'MAX ' + prevCap + ' → ' + r.cap : 'MAX LV ' + r.cap;
    return {
      c: {
        name: d.name, kind: d.kind, rarityLabel: d.rarity.toUpperCase(),
        color: r.color, tint: r.tint, border: r.border,
        isDamage: d.icon === 'damage', isHp: d.icon === 'hp', isOrbit: d.icon === 'orbit', isBeacon: d.icon === 'beacon',
        rarityUp: !!d.rarityUp, isNew: d.fromLv === 0 && !d.oneUse,
        effectLabel: d.effectLabel, effectFrom: d.effectFrom, effectTo: d.effectTo, hasArrow: !!d.effectTo,
        oneUse: !!d.oneUse, hasLevels: !d.oneUse, levelText: levelText, capText: capText, pips: pips,
        price: d.full ? 'SLOTS FULL' : (d.affordable ? 'BUY  ' + d.price : 'NEED ' + d.price),
        affordable: !!d.affordable && !d.full, broke: !d.affordable || !!d.full, showNut: !d.full
      }
    };
  }
}
</script>
</body>
</html>
